name: Build melonDS HD APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: this image ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Gradle downloads anything still missing during the build, now that the licenses are accepted
          "$SDKMANAGER" --install "platforms;android-37" "ndk;28.0.13004108" "cmake;3.22.1" || echo "::warning::Some SDK packages could not be preinstalled"

      - name: Prepare signing key
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="${{ runner.temp }}/keystore.jks"
          if [ -n "$MELONDS_KEYSTORE" ]; then
            echo "$MELONDS_KEYSTORE" | base64 -d > "$KEYSTORE"
            PASSWORD="$MELONDS_KEYSTORE_PASSWORD"
          else
            # No signing secret configured: generate a throwaway key so the APK can still be installed.
            # Add MELONDS_KEYSTORE/MELONDS_KEYSTORE_PASSWORD secrets to keep the same key across builds (needed to update in place).
            PASSWORD="melondshd"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -alias melonds -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=melonDS HD"
          fi
          echo "MELONDS_KEYSTORE=$KEYSTORE" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$PASSWORD" >> local.properties

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdRelease
          cp app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk melonDS-HD.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-HD
          path: melonDS-HD.apk

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: melonds-hd-latest
          commit: ${{ github.sha }}
          name: 'Spirit Tracks HD (latest build)'
          body: 'Spirit Tracks HD: melonDS with HD defaults (OpenGL, 4x internal resolution, Quilez filter) and a Screen fit option under Settings > Video.'
          artifacts: melonDS-HD.apk
          artifactContentType: application/vnd.android.package-archive
