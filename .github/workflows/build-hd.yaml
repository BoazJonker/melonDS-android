name: Build melonDS HD APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

# Only build the newest push: an older build finishing later would otherwise replace the APK on the release page with an older version
concurrency:
  group: build-hd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: this image ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Gradle downloads anything still missing during the build, now that the licenses are accepted
          "$SDKMANAGER" --install "platforms;android-37" "ndk;28.0.13004108" "cmake;3.22.1" || echo "::warning::Some SDK packages could not be preinstalled"

      - name: Prepare signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          KEYSTORE="${{ runner.temp }}/keystore.jks"
          if [ -n "$SIGNING_PASSWORD" ]; then
            # Permanent key, stored encrypted in the repo. The same key signs every build, so updates install over the previous version
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in .github/signing/release.jks.enc -out "$KEYSTORE" -pass env:SIGNING_PASSWORD; then
              echo "::error::Could not unlock the signing key. Check that the SIGNING_PASSWORD secret is correct."
              exit 1
            fi
            PASSWORD="$SIGNING_PASSWORD"
          else
            # No SIGNING_PASSWORD secret configured: generate a throwaway key so the APK can still be installed.
            # Each build then has a different key, so the previous version must be uninstalled before installing a new one.
            echo "::warning::SIGNING_PASSWORD secret not set. Signing with a throwaway key."
            PASSWORD="melondshd"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -alias melonds -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=melonDS HD"
          fi
          echo "MELONDS_KEYSTORE=$KEYSTORE" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$PASSWORD" >> local.properties

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdRelease
          cp app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk Spirit-Tracks-HD.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spirit-Tracks-HD
          path: Spirit-Tracks-HD.apk

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: melonds-hd-latest
          commit: ${{ github.sha }}
          name: 'Spirit Tracks HD (latest build)'
          body: 'Spirit Tracks HD: melonDS with HD defaults (OpenGL, 4x internal resolution, Quilez filter) and a Screen fit option under Settings > Video.'
          artifacts: Spirit-Tracks-HD.apk
          artifactContentType: application/vnd.android.package-archive
